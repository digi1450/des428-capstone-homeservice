# Apply AFTER root resources and authenticated overlay. Preliminary, not load evidence.
services:
  keycloak-db:
    mem_limit: 256m
    memswap_limit: 256m
  keycloak:
    mem_limit: 1024m
    memswap_limit: 1024m
    environment:
      # Leave native/JIT/augmentation headroom inside the existing1GiB no-swap cap.
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
  tls:
    mem_limit: 128m
    memswap_limit: 128m
  rabbitmq:
    mem_limit: 512m
    memswap_limit: 512m
  prometheus:
    mem_limit: 256m
    memswap_limit: 256m
  grafana:
    mem_limit: 256m
    memswap_limit: 256m
  jaeger:
    mem_limit: 512m
    memswap_limit: 512m
