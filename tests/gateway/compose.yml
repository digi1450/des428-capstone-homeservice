# Isolated routing fixtures, NOT the team's application stack. No host ports/data.
services:
  edemand:
    image: node:22-alpine
    environment: {BACKEND: monolith, PORT: 3000}
    volumes: ["./backend.mjs:/test/backend.mjs:ro"]
    command: ["node", "/test/backend.mjs"]
  notifications:
    image: node:22-alpine
    environment: {BACKEND: notifications, PORT: 3001}
    volumes: ["./backend.mjs:/test/backend.mjs:ro"]
    command: ["node", "/test/backend.mjs"]
  payments-wallet:
    image: node:22-alpine
    environment: {BACKEND: payments-wallet, PORT: 3002}
    volumes: ["./backend.mjs:/test/backend.mjs:ro"]
    command: ["node", "/test/backend.mjs"]
  baseline:
    image: nginx:1.28-alpine
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/routes.baseline.conf:/etc/nginx/routes.conf:ro
  candidate:
    image: nginx:1.28-alpine
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/routes.services.conf:/etc/nginx/routes.conf:ro
  test:
    image: node:22-alpine
    profiles: [test]
    volumes: ["./:/test:ro"]
    working_dir: /test
    entrypoint: [node, --test]
    command: [routing.test.mjs]
