# Docker network only; E owns the final Compose wiring and TLS entrypoint.
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
        default $request_id;
    }
    # Deliberately omit query strings, headers, cookies and request bodies.
    log_format gateway '$request_method $uri $status request_id=$correlation_id';
    access_log /dev/stdout gateway;
    upstream monolith_backend {
        zone monolith_backend 64k;
        server edemand:3000 resolve;
        keepalive 16;
    }
    upstream notifications_backend {
        zone notifications_backend 64k;
        server notifications:3001 resolve;
        keepalive 16;
    }
    upstream payments_backend {
        zone payments_backend 64k;
        server payments-wallet:3002 resolve;
        keepalive 16;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $correlation_id;
        # B must validate tokens; caller-supplied identity headers are not credentials.
        proxy_set_header X-Role "";
        proxy_set_header X-User-Id "";
        proxy_set_header Forwarded "";
        proxy_hide_header X-Request-Id;
        add_header X-Request-Id $correlation_id always;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_buffering off;
        location = /gateway/health {
            default_type application/json;
            return 200 '{"status":"alive"}';
        }
        # C's commands are service-to-service, never a public gateway route.
        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }
        include /etc/nginx/routes.conf;
    }
}
