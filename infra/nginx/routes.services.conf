# CANDIDATE ONLY: do not activate before the handoff acceptance checklist passes.
# No URI suffix on proxy_pass: retain the complete path and query string.
location = /api/notifications { proxy_pass http://notifications_backend; }
location ^~ /api/notifications/ { proxy_pass http://notifications_backend; }
location ~ ^/api/(provider/wallet|customer/transactions)(/|$) {
    proxy_pass http://payments_backend;
}
location = /api/payments { proxy_pass http://payments_backend; }
location ^~ /api/payments/ { proxy_pass http://payments_backend; }
# HTML pages, Next assets, Booking/Bidding and other API paths remain monolith-owned.
location / { proxy_pass http://monolith_backend; }
