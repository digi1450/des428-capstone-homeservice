# Local trusted TLS entrypoints. Browser cookie requests stay with Next's A callers;
# direct service origins require B Bearer tokens. No candidate cookie-to-service cutover.
worker_processes 1;
# Request-level upstream errors can include an OIDC callback query. Access and
# request error logging are disabled in this local proxy; use application health.
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    server_tokens off;
    # Omit request/query/token data from this integration proxy's logs.
    access_log off;
    ssl_certificate /run/secrets/local_cert;
    ssl_certificate_key /run/secrets/local_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Role "";
    proxy_set_header X-User-Id "";
    proxy_set_header Forwarded "";
    proxy_next_upstream off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    server {
        listen 18444 ssl default_server;
        server_name _;
        return 404;
    }
    server {
        listen 18444 ssl;
        server_name app.homeservice.test;
        set $owner edemand:3000;
        location ^~ /api/internal/ { return 404; }
        location ^~ /internal { return 404; }
        location / { proxy_pass http://$owner; }
    }
    server {
        listen 18444 ssl;
        server_name payments.homeservice.test;
        set $owner payments-wallet:3002;
        # Machine command routes remain private to the Compose network.
        location ^~ /internal { return 404; }
        location / { proxy_pass http://$owner; }
    }
    server {
        listen 18444 ssl;
        server_name notifications.homeservice.test;
        set $owner notifications:3001;
        location / { proxy_pass http://$owner; }
    }
    # Not host-published; B resolver authentication is still mandatory.
    server {
        listen 18445 ssl;
        server_name identity.homeservice.test;
        set $owner edemand:3000;
        location = /api/internal/identity/resolve { proxy_pass http://$owner; }
        location / { return 404; }
    }
    # Booking's authenticated client needs /internal on a private TLS listener.
    server {
        listen 18446 ssl;
        server_name payments.homeservice.test;
        set $owner payments-wallet:3002;
        location / { proxy_pass http://$owner; }
    }
}
