name: Financial caller and HTTP boundary
on:
  pull_request:
jobs:
  financial-boundary:
    name: Booking callers and financial HTTP boundary
    runs-on: ${{ github.actor == 'digi1450' && vars.HOMESERVICE_VM_CI == 'true' && fromJSON('["self-hosted","Linux","ARM64","homeservice-ci"]') || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: financial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d financial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/financial_test
      TEST_PAYMENTS_DATABASE_URL: postgres://test_user:test_password@localhost:5432/financial_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bangkok-homeservice/package-lock.json
            services/payments-wallet/package-lock.json
      - name: Install locked monolith and Payments dependencies
        run: |
          npm ci --prefix bangkok-homeservice
          npm ci --prefix services/payments-wallet
      - name: Monolith callers and client tests
        run: npm test --prefix bangkok-homeservice
      - name: Provisioning, financial and payment-view HTTP/PostgreSQL boundaries
        # Fixed synthetic Booking IDs require these independent test files to run serially.
        run: >-
          node --test --test-concurrency=1
          tests/integration/a-payment-runtime-boundary.test.mjs
          tests/integration/financial-finalization-boundary.test.mjs
          tests/integration/payment-views-boundary.test.mjs
      - name: Booking durable finalization and cancellation recovery against Payments
        # Run after the earlier boundaries; this suite also creates wallet/financial state.
        run: node --test tests/integration/c-booking-finalization-e2e.test.mjs
