
name: Pact Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'OWNERS.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

jobs:
  pact-contracts:
    name: Consumer and Provider Verification
    runs-on: ${{ github.actor == 'digi1450' && vars.HOMESERVICE_VM_CI == 'true' && fromJSON('["self-hosted","Linux","ARM64","homeservice-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: homeservice-e-pact-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pact contract tests
        run: docker compose -f docker-compose.pact.yml run --rm --build pact-tests
      - name: Clean up disposable Pact infrastructure
        if: always()
        run: docker compose -f docker-compose.pact.yml down --volumes --remove-orphans

  api-contracts:
    name: API schemas and fixtures
    runs-on: ${{ github.actor == 'digi1450' && vars.HOMESERVICE_VM_CI == 'true' && fromJSON('["self-hosted","Linux","ARM64","homeservice-ci"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install locked contract dependencies
        run: npm ci --prefix contracts
      - name: Validate OpenAPI, fixtures and reference invariants
        run: npm test --prefix contracts
