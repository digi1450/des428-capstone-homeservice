name: C read-only consistency checker
on:
  pull_request:
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'OWNERS.md'
      - 'CONTRIBUTING.md'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  consistency-check:
    name: C schema, command identity and unacked broker regression
    runs-on: ${{ github.actor == 'digi1450' && vars.HOMESERVICE_VM_CI == 'true' && fromJSON('["self-hosted","Linux","ARM64","homeservice-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run real SQLite, PostgreSQL and RabbitMQ checker regressions
        run: bash scripts/run-consistency-check-tests.sh
