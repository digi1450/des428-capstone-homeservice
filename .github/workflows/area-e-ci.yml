
name: Area E - Service Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'OWNERS.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

jobs:
  service-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - notifications
          - payments-wallet

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: homeservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d homeservice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    env:
      TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/homeservice_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run service and PostgreSQL integration tests
        run: npm test
