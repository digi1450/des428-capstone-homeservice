name: E actual full-flow telemetry
on:
  pull_request:
    paths:
      - 'bangkok-homeservice/**'
      - 'services/**'
      - 'tests/final-stack/**'
      - 'tests/resource-budget/**'
      - 'infra/grafana/**'
      - 'infra/prometheus/**'
      - 'docker-compose*.yml'
      - '.github/workflows/full-flow-telemetry.yml'
  push:
    branches: [main]
    paths:
      - 'bangkok-homeservice/**'
      - 'services/**'
      - 'tests/final-stack/**'
      - 'tests/resource-budget/**'
      - 'infra/grafana/**'
      - 'infra/prometheus/**'
      - 'docker-compose*.yml'
      - '.github/workflows/full-flow-telemetry.yml'
  workflow_dispatch:
jobs:
  full-flow:
    name: Actual 16-service traces, logs, dashboard and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINAL_STACK_PROJECT: homeservice-e-auth-ci-${{ github.run_id }}-${{ github.run_attempt }}
      FINAL_STACK_TELEMETRY: 'true'
      FINAL_STACK_FAULTS: 'true'
      FINAL_STACK_RESOURCES: 'true'
      COMPOSE_PARALLEL_LIMIT: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate sanitized Compose diagnostics
        run: node --test tests/final-stack/compose-diagnostic.test.mjs
      - name: Actual authenticated flows, telemetry and scoped recovery
        run: node tests/final-stack/run.mjs
      - name: Save only sanitized resource evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task6-resource-evidence
          path: output/task6-*/*.json*
          if-no-files-found: warn
