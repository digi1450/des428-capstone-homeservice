name: Legacy v1.1 Booking and Payments boundary
on:
  pull_request:
    paths:
      - 'bangkok-homeservice/**'
      - 'services/payments-wallet/**'
      - 'tools/data-migration/**'
      - 'contracts/**'
      - 'tests/integration/legacy-v11-boundary.test.mjs'
      - '.github/workflows/legacy-v11.yml'
jobs:
  legacy-v11:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fixture:fixture@localhost:5432/fixture
      NODE_ENV: test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: |
            bangkok-homeservice/package-lock.json
            services/payments-wallet/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix bangkok-homeservice
          npm ci --prefix services/payments-wallet
      - name: Actual legacy Booking client HTTP and PostgreSQL boundary
        run: node --test tests/integration/legacy-v11-boundary.test.mjs
