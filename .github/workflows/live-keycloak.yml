name: Real Keycloak and browser-service acceptance
on:
  pull_request:
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'OWNERS.md'
      - 'CONTRIBUTING.md'
jobs:
  live-keycloak:
    name: Real Keycloak PKCE, ownership and financial flow
    runs-on: ${{ github.actor == 'digi1450' && vars.HOMESERVICE_VM_CI == 'true' && fromJSON('["self-hosted","Linux","ARM64","homeservice-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fresh TLS realm, actual Next/services/PostgreSQL/RabbitMQ and fresh-key reimport
        run: bash tests/live-keycloak/run.sh
